  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Captured Global Error:', e.error || e.message);
        var el = document.getElementById('debug-error-overlay');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-error-overlay';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999999;background:#b91c1c;color:#fff;padding:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
          document.body.appendChild(el);
        }
        el.innerText = 'Application Error:\n' + (e.error ? (e.error.stack || e.error.message) : e.message);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
