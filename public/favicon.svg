<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aiBuildGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="18" fill="#07090e" />
  <!-- Gradient Accent Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#aiBuildGrad)" stroke-width="2.5" opacity="0.9" />
  <!-- Subtle ambient inner glow -->
  <circle cx="32" cy="32" r="22" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <!-- Brand Monogram AB -->
  <text x="32" y="40" font-family="'Syne', 'Bodoni Moda', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">AB</text>
</svg>
